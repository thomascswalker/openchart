<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Highway Geometry Gallery</title>
  </head>
  <body>
    <main id="gallery">
      <header class="gallery-header">
        <div>
          <h1>Highway Geometry Gallery</h1>
          <p>Production assets and procedural HighwayView samples</p>
        </div>
        <p class="controls-help">
          Orbit: left-drag · Pan: right-drag · Zoom: mouse wheel
        </p>
        <span id="status" role="status">Loading highway assets…</span>
      </header>
      <div id="viewport" aria-label="Three.js geometry gallery"></div>
      <pre id="error" role="alert" hidden></pre>
    </main>
    <script type="module" src="/src/geometryGallery.ts"></script>
  </body>
</html>
