[package]
name = "openchart_workflow_desktop"
version = "0.1.0"
description = "OpenChart Workflow Desktop"
authors = ["Thomas Walker"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2.7.3"
tauri-plugin-deep-link = "2.6.3"

[lib]
name = "openchart_workflow_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
