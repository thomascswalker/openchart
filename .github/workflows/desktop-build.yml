name: Build Desktop Applications

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux bundles
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            rpm \
            wget

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build frontend dependencies
        run: npm run build:desktop

      - name: Prepare release version
        run: node apps/desktop/scripts/prepare-release.mjs "0.1.${{ github.run_number }}"

      - name: Build desktop application
        run: npm run desktop:build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Verify Linux bundles
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="apps/desktop/src-tauri/target/release/bundle"
          test -n "$(find "$bundle_root/appimage" -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$(find "$bundle_root/appimage" -maxdepth 1 -type f -name '*.AppImage.sig' -print -quit)"
          test -n "$(find "$bundle_root/deb" -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$(find "$bundle_root/rpm" -maxdepth 1 -type f -name '*.rpm' -print -quit)"

      - name: Upload Linux bundles
        uses: actions/upload-artifact@v4
        with:
          name: openchart-linux-x86_64
          path: |
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage.sig
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build Windows bundles
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build frontend dependencies
        run: npm run build:desktop

      - name: Prepare release version
        run: node apps/desktop/scripts/prepare-release.mjs "0.1.${{ github.run_number }}"

      - name: Build desktop application
        run: npm run desktop:build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Verify Windows bundles
        shell: pwsh
        run: |
          $bundleRoot = "apps/desktop/src-tauri/target/release/bundle"
          $nsisBundles = Get-ChildItem "$bundleRoot/nsis" -Filter "*.exe" -File
          $msiBundles = Get-ChildItem "$bundleRoot/msi" -Filter "*.msi" -File
          if ($nsisBundles.Count -eq 0) { throw "No NSIS installer was produced." }
          if ($msiBundles.Count -eq 0) { throw "No MSI installer was produced." }
          $nsisSignatures = Get-ChildItem "$bundleRoot/nsis" -Filter "*.exe.sig" -File
          $msiSignatures = Get-ChildItem "$bundleRoot/msi" -Filter "*.msi.sig" -File
          if ($nsisSignatures.Count -eq 0) { throw "No NSIS updater signature was produced." }
          if ($msiSignatures.Count -eq 0) { throw "No MSI updater signature was produced." }

      - name: Upload Windows bundles
        uses: actions/upload-artifact@v4
        with:
          name: openchart-windows-x86_64
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi.sig
          if-no-files-found: error
          retention-days: 14

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-windows
    if: needs.build-linux.result == 'success' && needs.build-windows.result == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: openchart-*
          path: release-assets
          merge-multiple: true

      - name: Generate updater manifest
        run: |
          version="$(node -p "require('./package.json').version")"
          node apps/desktop/scripts/generate-latest-json.mjs \
            --version "$version" \
            --tag "build-${{ github.sha }}" \
            --repo "$GITHUB_REPOSITORY" \
            --assets release-assets \
            --out release-assets/latest.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: build-${{ github.sha }}
          MERGE_COMMIT: ${{ github.sha }}
        run: |
          mapfile -d '' release_files < <(find release-assets -type f -print0)
          if [[ "${#release_files[@]}" -eq 0 ]]; then
            echo "No release artifacts were downloaded."
            exit 1
          fi

          gh release create "$RELEASE_TAG" "${release_files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$MERGE_COMMIT" \
            --title "OpenChart Desktop $RELEASE_TAG" \
            --generate-notes \
            --latest
