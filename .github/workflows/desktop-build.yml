name: Build Desktop Applications

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux bundles
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            rpm \
            wget

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build frontend dependencies
        run: npm run build:desktop

      - name: Build desktop application
        run: npm run desktop:build

      - name: Verify Linux bundles
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="apps/desktop/src-tauri/target/release/bundle"
          test -n "$(find "$bundle_root/appimage" -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$(find "$bundle_root/deb" -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$(find "$bundle_root/rpm" -maxdepth 1 -type f -name '*.rpm' -print -quit)"

      - name: Upload Linux bundles
        uses: actions/upload-artifact@v4
        with:
          name: midiview-linux-x86_64
          path: |
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build Windows bundles
    runs-on: windows-latest
    if: github.event.pull_request.merged == true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build frontend dependencies
        run: npm run build:desktop

      - name: Build desktop application
        run: npm run desktop:build

      - name: Verify Windows bundles
        shell: pwsh
        run: |
          $bundleRoot = "apps/desktop/src-tauri/target/release/bundle"
          $nsisBundles = Get-ChildItem "$bundleRoot/nsis" -Filter "*.exe" -File
          $msiBundles = Get-ChildItem "$bundleRoot/msi" -Filter "*.msi" -File
          if ($nsisBundles.Count -eq 0) { throw "No NSIS installer was produced." }
          if ($msiBundles.Count -eq 0) { throw "No MSI installer was produced." }

      - name: Upload Windows bundles
        uses: actions/upload-artifact@v4
        with:
          name: midiview-windows-x86_64
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-windows
    if: needs.build-linux.result == 'success' && needs.build-windows.result == 'success'

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: midiview-*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: build-${{ github.event.pull_request.merge_commit_sha }}
          MERGE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$MERGE_COMMIT" \
            --title "MIDIView Desktop $RELEASE_TAG" \
            --generate-notes
