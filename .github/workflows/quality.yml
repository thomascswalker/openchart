name: Quality

on:
  pull_request:

permissions:
  contents: read

jobs:
  version:
    name: Version check
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify package version is newer than the latest version tag
        run: node apps/desktop/scripts/verify-release-version.mjs

  quality:
    name: Quality checks
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks
        run: npm run check

  tests:
    name: Tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      - name: Run editor end-to-end tests
        run: npm run test:e2e --workspace=@openchart/editor

      - name: Build Storybook package dependencies
        run: |
          npm run build --workspace=@openchart/core
          npm run build --workspace=@openchart/views

      - name: Build Storybook
        run: npm run build-storybook

      - name: Run Storybook browser tests
        run: npm run test:storybook --workspace=@openchart/editor

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/editor/playwright-report/
          retention-days: 14

  typecheck:
    name: Type check
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check-types
