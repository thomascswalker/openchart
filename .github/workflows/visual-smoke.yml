name: Visual smoke

on:
  pull_request:

permissions:
  contents: read

jobs:
  visual:
    name: Capture Three.js view screenshots
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build editor
        run: |
          npm run build --workspace=@midiedit/core
          npm run build --workspace=@midiedit/views
          npm run build --workspace=@midiedit/editor

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start editor preview
        run: |
          npm run preview --workspace=@midiedit/editor -- --host 127.0.0.1 --port 4173 > /tmp/midiview-preview.log 2>&1 &
          echo $! > /tmp/midiview-preview.pid

      - name: Capture piano-roll and highway screenshots
        run: node tools/visual-smoke.mjs

      - name: Upload interface screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: threejs-interface-screenshots
          path: artifacts/*.png
          if-no-files-found: error
